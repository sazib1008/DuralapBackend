      <<: *infra-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
    networks:
      - duralap_network

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
