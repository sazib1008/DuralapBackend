# Duralap Backend — full-stack Docker deployment (macOS ARM64/Intel, Windows, Linux)
# Run: ./run.sh

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: docker
  SERVER_ADDRESS: 0.0.0.0
  MONGODB_URI: ${MONGODB_URI:-mongodb+srv://sazib1008:VIlessaUR74ymfKG@cluster0.lsfwn33.mongodb.net/?appName=Cluster0}
  SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb+srv://sazib1008:VIlessaUR74ymfKG@cluster0.lsfwn33.mongodb.net/?appName=Cluster0}
  SPRING_DATA_REDIS_URL: redis://redis:6379
  SPRING_DATA_REDIS_SSL_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForDuralapAppWhichIsVerySecureAndLongEnoughForHS512}

x-infra-depends: &infra-depends
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

services:
  # ==========================================
  # Infrastructure Layer
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: duralap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - duralap_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: duralap_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zookeeper-ready 2181 1 || nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - duralap_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: duralap_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 30 -b localhost:29092 || nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - duralap_network

  # ==========================================
  # Microservices Layer (10 Services)
  # ==========================================

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway-service
    image: duralap/gateway-service:latest
    container_name: duralap_gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      <<: *spring-env
      SERVER_PORT: 8080
    depends_on:
      <<: *infra-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
    networks:
      - duralap_network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    image: duralap/auth-service:latest
    container_name: duralap_auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
      SERVER_PORT: 8081
    depends_on:
      <<: *infra-depends
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
    networks:
      - duralap_network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    image: duralap/user-service:latest
    container_name: duralap_user
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
    depends_on:
