# Duralap Backend — Modular Monolith Docker Deployment
# Run: docker compose up -d

services:
  # ==========================================
  # Single Modular Monolith Application
  # ==========================================
  duralap-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: duralap/backend:latest
    container_name: duralap_modular_monolith
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://sazibhossainsazib1008:VIlessaUR74ymfKG@cluster0.lsfwn33.mongodb.net/?appName=Cluster0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-https://ussecjukilmnfbvozjxq.supabase.co}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-media}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY:-REPLACE_WITH_SUPABASE_ANON_KEY}
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForDuralapAppWhichIsVerySecureAndLongEnoughForHS512}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - duralap_network

  # ==========================================
  # Optional Local Cache / PubSub
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: duralap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - duralap_network

networks:
  duralap_network:
    driver: bridge
