spring.application.name=duralap-backend
spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# MongoDB Atlas / Local Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.max-connection-life-time=60000
spring.data.mongodb.max-connections-per-host=100
spring.data.mongodb.min-connections-per-host=10

# Redis Upstash / Local Configuration
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.timeout=3000ms

# Supabase Storage Configuration (Optional)
supabase.url=${SUPABASE_URL:}
supabase.bucket=${SUPABASE_BUCKET:media}
supabase.api.key=${SUPABASE_API_KEY:}

# WebRTC TURN Configuration (Optional)
webrtc.turn.url=${WEBRTC_TURN_URL:}
webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-in-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-in-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Observability Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.org.springframework.security=INFO
logging.level.com.example.duralap=INFO

# Jackson Optimization
spring.jackson.default-property-inclusion=non_null
